services:
  deskthing:
    build: .
    container_name: deskthing
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      DATA_DIR: /app/data
    volumes:
      # holds spotify-token.json (written by `npm run spotify-auth`)
      - ./data:/app/data
      # Lab tab: container status. Note: socket access is root-equivalent on the host.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
